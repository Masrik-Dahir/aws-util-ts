<svg xmlns="http://www.w3.org/2000/svg" width="800" height="120" viewBox="0 0 800 120">
  <defs>
    <linearGradient id="aws-author-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="50%" stop-color="#0d1f3c"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </linearGradient>
    <linearGradient id="aws-author-line1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00d4ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aws-author-line2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff9900" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff9900" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ff9900" stop-opacity="0"/>
    </linearGradient>
    <filter id="aws-author-glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="120" fill="url(#aws-author-bg)"/>

  <!-- Animated packet nodes on left side -->
  <circle cx="60" cy="30" r="3" fill="#00d4ff" opacity="0.7">
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="20" r="2" fill="#00d4ff" opacity="0.5">
    <animate attributeName="opacity" values="0.1;0.8;0.1" dur="1.7s" begin="0.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="90" cy="55" r="2.5" fill="#ff9900" opacity="0.6">
    <animate attributeName="opacity" values="0.15;0.85;0.15" dur="2.4s" begin="0.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="75" r="2" fill="#00d4ff" opacity="0.5">
    <animate attributeName="opacity" values="0.2;0.7;0.2" dur="1.9s" begin="1.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="85" r="3" fill="#ff9900" opacity="0.4">
    <animate attributeName="opacity" values="0.1;0.6;0.1" dur="2.6s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="110" cy="105" r="2" fill="#00d4ff" opacity="0.4">
    <animate attributeName="opacity" values="0.1;0.5;0.1" dur="3.1s" begin="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Animated packet nodes on right side -->
  <circle cx="740" cy="25" r="3" fill="#00d4ff" opacity="0.7">
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="1.8s" begin="0.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="680" cy="15" r="2" fill="#ff9900" opacity="0.5">
    <animate attributeName="opacity" values="0.1;0.7;0.1" dur="2.2s" begin="0.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="760" cy="60" r="2.5" fill="#ff9900" opacity="0.6">
    <animate attributeName="opacity" values="0.15;0.8;0.15" dur="2.0s" begin="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="80" r="2" fill="#00d4ff" opacity="0.5">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="2.8s" begin="0.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="670" cy="100" r="3" fill="#ff9900" opacity="0.4">
    <animate attributeName="opacity" values="0.1;0.6;0.1" dur="1.6s" begin="1.0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="750" cy="100" r="2" fill="#00d4ff" opacity="0.4">
    <animate attributeName="opacity" values="0.1;0.5;0.1" dur="2.5s" begin="0.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Horizontal pulse lines -->
  <rect x="0" y="3" width="800" height="1" fill="url(#aws-author-line1)" opacity="0.5">
    <animate attributeName="opacity" values="0;0.7;0" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="0" y="117" width="800" height="1" fill="url(#aws-author-line2)" opacity="0.5">
    <animate attributeName="opacity" values="0;0.6;0" dur="3.5s" begin="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Moving packet left-to-right -->
  <circle cx="0" cy="10" r="3" fill="#00d4ff" filter="url(#aws-author-glow)">
    <animate attributeName="cx" values="-10;810" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite"/>
  </circle>
  <!-- Moving packet right-to-left -->
  <circle cx="810" cy="110" r="3" fill="#ff9900" filter="url(#aws-author-glow)">
    <animate attributeName="cx" values="810;-10" dur="4.5s" begin="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="4.5s" begin="2s" repeatCount="indefinite"/>
  </circle>
  <!-- Second packet left-to-right offset -->
  <circle cx="0" cy="60" r="2.5" fill="#ff9900" filter="url(#aws-author-glow)">
    <animate attributeName="cx" values="-10;810" dur="5s" begin="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="5s" begin="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Text overlay background -->
  <rect x="180" y="28" width="440" height="65" rx="8" fill="#000000" opacity="0.45"/>

  <!-- Author name -->
  <text x="400" y="57" font-family="'Segoe UI',sans-serif" font-size="27" font-weight="700"
        fill="#ffffff" text-anchor="middle" letter-spacing="3" filter="url(#aws-author-glow)">
    Masrik Dahir<animate attributeName="opacity" values="0;1" dur="1s" fill="freeze"/>
  </text>
  <!-- Website -->
  <text x="400" y="82" font-family="'Segoe UI',sans-serif" font-size="13"
        fill="#00d4ff" text-anchor="middle" letter-spacing="2">
    ✦ masrikdahir.com ✦<animate attributeName="opacity" values="0;1" begin="0.6s" dur="0.8s" fill="freeze"/>
  </text>
</svg>
